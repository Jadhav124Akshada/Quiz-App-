<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<script>
  // Example format: [{ score: 85, time: "01:20", player: "Alice", date: "2025-08-09" }]
  let scores = JSON.parse(localStorage.getItem("quizScores")) || [];

  const scoreboardBody = document.getElementById("scoreboard-data");

  if (scores.length === 0) {
    scoreboardBody.innerHTML = "<tr><td colspan='4'>No scores yet!</td></tr>";
  } else {
    scores
      .sort((a, b) => b.score - a.score) // highest score first
      .forEach(scoreObj => {
        let row = `<tr>
          <td>${scoreObj.score}</td>
          <td>${scoreObj.time}</td>
          <td>${scoreObj.player}</td>
          <td>${scoreObj.date}</td>
        </tr>`;
        scoreboardBody.innerHTML += row;
      });
  }

</script>

<body>

  <!-- Navbar -->

      <h2>Scoreboard</h2>

          <tr>
            <th>Score</th>

            <th>Player</th>
            <th>Date</th>

        </thead>
